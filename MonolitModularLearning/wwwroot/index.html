<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolit E-Ticarət</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --bg-color: #f3f4f6;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar */
        .navbar-custom {
            background-color: var(--primary-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        /* Axtarış Qutusu */
        .search-form {
            width: 100%;
            max-width: 400px;
        }

        .search-input {
            border-radius: 20px 0 0 20px;
            border: none;
            padding-left: 20px;
        }

        .search-btn {
            border-radius: 0 20px 20px 0;
            background-color: white;
            color: var(--primary-color);
            border: none;
            padding-right: 20px;
        }

        /* Sidebar (Kateqoriyalar) */
        .category-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .list-group-item {
            border: none;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .list-group-item:hover {
                background-color: #eef2ff;
                color: var(--primary-color);
                cursor: pointer;
            }

            .list-group-item.active {
                background-color: var(--primary-color);
                border-color: var(--primary-color);
            }

        /* Product Card */
        .product-card {
            border: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

            .product-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            }

        .product-img-box {
            background-color: #eef2ff;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px 12px 0 0;
            color: var(--primary-color);
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: #10b981;
        }

        /* Actions */
        .crud-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            opacity: 0;
            transition: 0.3s;
            display: flex;
            gap: 5px;
        }

        .product-card:hover .crud-actions {
            opacity: 1;
        }

        .cat-actions {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
        <div class="container d-flex flex-wrap align-items-center justify-content-between">
            <a class="navbar-brand mb-2 mb-lg-0" href="#" onclick="selectCategory(null, 'Bütün Məhsullar')">
                <i class="fas fa-shopping-bag me-2"></i>MonolitShop
            </a>

            <!-- AXTARIŞ QUTUSU -->
            <form class="d-flex search-form mx-lg-auto mb-2 mb-lg-0" onsubmit="handleSearch(event)">
                <input class="form-control search-input shadow-none" type="search" id="searchInput"
                       placeholder="Məhsul axtar (məs: telefon)..." oninput="liveSearch(event)">
                <button class="btn search-btn shadow-none" type="submit"><i class="fas fa-search"></i></button>
            </form>

            <div class="d-flex gap-2">
                <button class="btn btn-light" onclick="openCategoryModal()">
                    <i class="fas fa-folder-plus"></i> <span class="d-none d-md-inline">Kateqoriya</span>
                </button>
                <button class="btn btn-light" onclick="openProductModal()">
                    <i class="fas fa-box-open"></i> <span class="d-none d-md-inline">Məhsul</span>
                </button>
                <button class="btn btn-warning position-relative px-3 px-md-4" onclick="viewBasket()">
                    <i class="fas fa-shopping-cart"></i> <span class="d-none d-md-inline">Səbət</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container mt-5">
        <div class="row">

            <!-- LEFT SIDEBAR: CATEGORIES -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card category-card">
                    <div class="card-header bg-white fw-bold py-3 fs-5 border-bottom-0">
                        <i class="fas fa-stream text-primary me-2"></i> Kateqoriyalar
                    </div>
                    <ul class="list-group list-group-flush" id="categoryList">
                        <!-- Kategoriyalar bura yüklənəcək -->
                    </ul>
                </div>
            </div>

            <!-- RIGHT SIDE: PRODUCTS -->
            <div class="col-lg-9 col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold text-dark m-0" id="mainTitle">Bütün Məhsullar</h3>
                </div>

                <div class="row g-4" id="productGrid">
                    <!-- Məhsullar bura yüklənəcək -->
                </div>

                <!-- PAGINATION -->
                <nav class="mt-5">
                    <ul class="pagination justify-content-center" id="paginationUI"></ul>
                </nav>
            </div>

        </div>
    </div>

    <!-- ================= MODALS ================= -->
    <!-- CATEGORY MODAL -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="catModalTitle">Kateqoriya Əlavə Et</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm" onsubmit="saveCategory(event)">
                        <input type="hidden" id="catId">
                        <div class="mb-3">
                            <label class="form-label">Kateqoriya Adı</label>
                            <input type="text" id="catName" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Yadda Saxla</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- PRODUCT MODAL -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="prodModalTitle">Məhsul Əlavə Et</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label">Məhsul Adı</label>
                            <input type="text" id="prodName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Qiymət (AZN)</label>
                            <input type="number" id="prodPrice" class="form-control" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kateqoriya</label>
                            <select id="prodCatId" class="form-select" required>
                                <!-- Seçimlər dinamik dolacaq -->
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Yadda Saxla</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- BASKET MODAL -->
    <div class="modal fade" id="basketModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold"><i class="fas fa-shopping-cart me-2"></i>Səbətim</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <table class="table table-hover m-0">
                        <thead class="table-light">
                            <tr>
                                <th>Məhsul</th>
                                <th>Miqdar</th>
                                <th>Qiymət</th>
                                <th>Cəmi</th>
                                <th></th> <!-- Silmə düyməsi üçün -->
                            </tr>
                        </thead>
                        <tbody id="basketItemsList"></tbody>
                    </table>
                </div>
                <div class="modal-footer d-flex justify-content-between bg-light">
                    <h4 class="text-success fw-bold m-0" id="basketTotalAmount">Cəmi: 0 AZN</h4>
                    <button type="button" class="btn btn-dark px-4">Sifarişi Tamamla</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const myBasketId = 1;
        let currentPage = 1;
        let currentCategoryId = null;
        let currentSearch = '';

        // --- MƏRKƏZİ API ÇAĞIRIŞ FUNKSİYASI (DÜZƏLDİLDİ!) ---
        async function apiCall(endpoint, method = 'GET', bodyData = null) {
            const options = { method: method, headers: {} };
            if (bodyData) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(bodyData);
            }

            try {
                const res = await fetch(endpoint, options);
                const json = await res.json();

                if (!res.ok || json.isSuccess === false) {
                    throw new Error(json.message || json.Message || 'Sistemdə xəta baş verdi');
                }

                // DÜZƏLİŞ BURA EDİLDİ:
                // GET sorğusunda 'data' gəlirsə onu qaytar, gəlmirsə (məsələn DELETE, POST, PUT) true qaytar ki, uğurlu olduğu bilinsin!
                if (json.data !== undefined && json.data !== null) return json.data;
                if (json.Data !== undefined && json.Data !== null) return json.Data;

                return true;
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Xəta!', text: err.message, confirmButtonColor: '#4f46e5' });
                return null;
            }
        }

        // ================= AXTARIŞ (LIVE SEARCH) =================
        let searchTimeout = null;

        function liveSearch(e) {
            currentSearch = e.target.value.trim();
            currentCategoryId = null;

            document.getElementById('mainTitle').innerText = currentSearch
                ? `Axtarış nəticəsi: "${currentSearch}"`
                : 'Bütün Məhsullar';

            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }

            searchTimeout = setTimeout(() => {
                loadCategories();
                loadProducts(1);
            }, 500);
        }

        function handleSearch(e) {
            e.preventDefault();
        }

        // ================= KATEQORİYA ƏMƏLİYYATLARI =================
        async function loadCategories() {
            const data = await apiCall('/api/category', 'GET');
            const list = document.getElementById('categoryList');
            const select = document.getElementById('prodCatId');

            list.innerHTML = `<li class="list-group-item py-3 fw-bold ${currentCategoryId === null ? 'active' : ''}"
                                              onclick="selectCategory(null, 'Bütün Məhsullar')">
                                              <span><i class="fas fa-th-large me-2"></i> Bütün Məhsullar</span>
                                          </li>`;
            select.innerHTML = '<option value="">Kateqoriya seçin...</option>';

            if (data && data.length > 0) {
                data.forEach(c => {
                    const id = c.Id || c.id;
                    const name = c.Name || c.name;

                    list.innerHTML += `
                                    <li class="list-group-item py-3 ${currentCategoryId === id ? 'active' : ''}">
                                        <span onclick="selectCategory(${id}, '${name}')" class="flex-grow-1">${name}</span>
                                        <div class="cat-actions">
                                            <button class="btn btn-sm btn-light text-info" onclick="openCategoryModal(${id}, '${name}')"><i class="fas fa-edit"></i></button>
                                            <button class="btn btn-sm btn-light text-danger" onclick="deleteCategory(${id})"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </li>`;

                    select.innerHTML += `<option value="${id}">${name}</option>`;
                });
            }
        }

        function selectCategory(id, name) {
            currentCategoryId = id;
            currentPage = 1;
            currentSearch = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('mainTitle').innerText = name;
            loadCategories();
            loadProducts();
        }

        function openCategoryModal(id = '', name = '') {
            document.getElementById('catId').value = id;
            document.getElementById('catName').value = name;
            document.getElementById('catModalTitle').innerText = id ? 'Kateqoriyanı Redaktə Et' : 'Yeni Kateqoriya';
            new bootstrap.Modal(document.getElementById('categoryModal')).show();
        }

        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('catId').value;
            const payload = { name: document.getElementById('catName').value };

            let result = id
                ? await apiCall(`/api/category/${id}`, 'PUT', payload)
                : await apiCall('/api/category', 'POST', payload);

            if (result !== null) {
                Swal.fire({ icon: 'success', title: 'Uğurlu!', text: 'Kateqoriya yadda saxlanıldı', timer: 1500, showConfirmButton: false });
                bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
                loadCategories();
            }
        }

        async function deleteCategory(id) {
            const confirm = await Swal.fire({ title: 'Əminsiniz?', text: "Bu kateqoriya silinəcək!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Bəli, sil!', cancelButtonText: 'Xeyr' });
            if (confirm.isConfirmed) {
                const result = await apiCall(`/api/category/${id}`, 'DELETE');
                if (result !== null) {
                    if (currentCategoryId === id) selectCategory(null, 'Bütün Məhsullar');
                    loadCategories();
                }
            }
        }

        // ================= MƏHSUL ƏMƏLİYYATLARI =================
        async function loadProducts(page = 1) {
            currentPage = page;
            let url = `/api/products?page=${currentPage}`;

            if (currentCategoryId !== null) {
                url = `/api/products/category/${currentCategoryId}`;
            } else if (currentSearch !== '') {
                url += `&search=${encodeURIComponent(currentSearch)}`;
            }

            const data = await apiCall(url, 'GET');
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(p => {
                    const id = p.Id || p.id;
                    const name = p.Name || p.name;
                    const price = p.Price || p.price;
                    const catId = p.CategoryId || p.categoryId;
                    const catName = p.CategroyName || p.categroyName || p.categoryName || '';

                    grid.innerHTML += `
                                    <div class="col-md-6 col-lg-4">
                                        <div class="card product-card h-100 position-relative">
                                            <div class="crud-actions">
                                                <button class="btn btn-sm btn-light text-primary shadow-sm" onclick="openProductModal(${id}, '${name}', ${price}, ${catId})"><i class="fas fa-edit"></i></button>
                                                <button class="btn btn-sm btn-light text-danger shadow-sm" onclick="deleteProduct(${id})"><i class="fas fa-trash"></i></button>
                                            </div>
                                            <div class="product-img-box">
                                                <i class="fas fa-box fa-4x opacity-50"></i>
                                            </div>
                                            <div class="card-body d-flex flex-column text-center">
                                                <span class="badge bg-secondary mb-2 mx-auto">${catName}</span>
                                                <h5 class="card-title fw-bold text-dark">${name}</h5>
                                                <div class="price-tag mb-3">${price} AZN</div>
                                                <button class="btn btn-outline-primary mt-auto fw-bold" onclick="addToBasket(${id})">
                                                    <i class="fas fa-cart-plus me-1"></i> Səbətə at
                                                </button>
                                            </div>
                                        </div>
                                    </div>`;
                });

                if (currentCategoryId === null) {
                    renderPagination(data.length);
                } else {
                    document.getElementById('paginationUI').innerHTML = '';
                }
            } else {
                grid.innerHTML = `<div class="col-12 text-center py-5">
                                                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                                                <h5 class="text-muted">Axtarışa uyğun məhsul tapılmadı.</h5>
                                              </div>`;
                renderPagination(0);
            }
        }

        function openProductModal(id = '', name = '', price = '', catId = '') {
            document.getElementById('prodId').value = id;
            document.getElementById('prodName').value = name;
            document.getElementById('prodPrice').value = price;
            document.getElementById('prodCatId').value = catId;
            document.getElementById('prodModalTitle').innerText = id ? 'Məhsulu Redaktə Et' : 'Yeni Məhsul';
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const payload = {
                name: document.getElementById('prodName').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                categoryId: parseInt(document.getElementById('prodCatId').value),
                description: "Avtomatik açıqlama"
            };

            let result = id
                ? await apiCall(`/api/products/${id}`, 'PUT', payload)
                : await apiCall('/api/products', 'POST', payload);

            if (result !== null) {
                Swal.fire({ icon: 'success', title: 'Uğurlu!', text: 'Məhsul yadda saxlanıldı', timer: 1500, showConfirmButton: false });
                bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
                loadProducts(currentPage);
            }
        }

        async function deleteProduct(id) {
            const confirm = await Swal.fire({ title: 'Əminsiniz?', text: "Bu məhsul silinəcək!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Bəli, sil!' });
            if (confirm.isConfirmed) {
                const result = await apiCall(`/api/products/${id}`, 'DELETE');
                if (result !== null) loadProducts(currentPage);
            }
        }

        function renderPagination(dataLength) {
            const ul = document.getElementById('paginationUI');
            ul.innerHTML = '';
            if (dataLength === 0 && currentPage === 1) return;

            ul.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                                            <button class="page-link" onclick="loadProducts(${currentPage - 1})">Əvvəlki</button>
                                         </li>`;

            ul.innerHTML += `<li class="page-item active"><button class="page-link">${currentPage}</button></li>`;

            const isLastPage = dataLength < 5;
            ul.innerHTML += `<li class="page-item ${isLastPage ? 'disabled' : ''}">
                                            <button class="page-link" onclick="loadProducts(${currentPage + 1})">Növbəti</button>
                                         </li>`;
        }

        // ================= SƏBƏT ƏMƏLİYYATLARI =================
        async function addToBasket(productId) {
            const payload = { productId: productId, quantity: 1 };
            const result = await apiCall(`/api/baskets/${myBasketId}/items`, 'POST', payload);

            if (result !== null) {
                const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                Toast.fire({ icon: 'success', title: 'Səbətə əlavə edildi!' });
            }
        }

        // SƏBƏTDƏN SİLMƏ
        async function removeFromBasket(productId) {
            const confirm = await Swal.fire({
                title: 'Silmək istəyirsiniz?',
                text: "Məhsul səbətdən çıxarılacaq!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Bəli, sil!',
                cancelButtonText: 'Xeyr'
            });

            if (confirm.isConfirmed) {
                const result = await apiCall(`/api/baskets/${myBasketId}/items/${productId}`, 'DELETE');

                // Məntiqi xəta düzəldildiyi üçün artıq 'result' null gəlməyəcək və bu kod işləyəcək!
                if (result !== null) {
                    Swal.fire({ icon: 'success', title: 'Silindi!', text: 'Məhsul səbətdən çıxarıldı.', timer: 1000, showConfirmButton: false });
                    viewBasket(); // Səbəti yeniləyir
                }
            }
        }

        async function viewBasket() {
            const data = await apiCall(`/api/baskets/${myBasketId}`, 'GET');
            const tbody = document.getElementById('basketItemsList');
            const totalDisplay = document.getElementById('basketTotalAmount');
            tbody.innerHTML = '';
            let totalAmount = 0;

            if (data && data.length > 0) {
                data.forEach(item => {
                    const productId = item.productId || item.ProductId;
                    const price = item.price || item.Price || 0;
                    const qty = item.quantity || item.Quantity || 0;
                    const name = item.productName || item.ProductName || 'Məhsul';
                    const itemTotal = price * qty;
                    totalAmount += itemTotal;

                    tbody.innerHTML += `
                                    <tr>
                                        <td class="align-middle fw-bold">${name}</td>
                                        <td class="align-middle"><span class="badge bg-primary rounded-pill px-3 py-2">${qty}</span></td>
                                        <td class="align-middle">${price} AZN</td>
                                        <td class="align-middle fw-bold text-success">${itemTotal} AZN</td>
                                        <td class="align-middle text-end">
                                            <button class="btn btn-sm btn-outline-danger" onclick="removeFromBasket(${productId})" title="Səbətdən sil">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>`;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Səbətiniz boşdur</td></tr>';
            }

            totalDisplay.innerText = `Cəmi: ${totalAmount} AZN`;

            // Modalın iki dəfə açılmasının (bug) qarşısını alır, yalnız lazım olanda göstərir
            const basketModalEl = document.getElementById('basketModal');
            const basketModal = bootstrap.Modal.getInstance(basketModalEl) || new bootstrap.Modal(basketModalEl);
            basketModal.show();
        }

        // --- SƏHİFƏ YÜKLƏNƏNDƏ ---
        window.onload = () => {
            loadCategories();
            loadProducts();
        };
    </script>
</body>
</html>
